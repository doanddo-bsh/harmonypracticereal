plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android Gradle Plugin.
    // It applies the Kotlin Gradle Plugin (declared in settings.gradle) itself.
    id "dev.flutter.flutter-gradle-plugin"
    // START: FlutterFire Configuration
    id "com.google.gms.google-services"
    // END: FlutterFire Configuration
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
} else {
    logger.warn("WARNING: android/key.properties not found — release build will be signed " +
                "with the DEBUG key. This artifact cannot be uploaded to Play.")
}

android {
    namespace = "com.seohwalee.harmonypracticereal"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.seohwalee.harmonypracticereal"
        minSdk = flutter.minSdkVersion
        // Google Play requires the target API level to stay within two years of
        // the latest Android release. API 36 = Android 16.
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        // Only declare the release config when it can actually be populated, so we
        // never leave a half-built config with a null storeFile lying around.
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Fall back to the debug key when key.properties is absent (e.g. a CI
            // checkout without secrets) so the build does not fail outright.
            signingConfig = keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug

            // 코드 난독화 및 사이즈 축소
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

// No Firebase dependencies are declared here on purpose. firebase_core applies the
// firebase-bom itself (pinned by its own FirebaseSDKVersion property) and
// firebase_analytics already declares firebase-analytics. To override the BOM, set
// ext.FirebaseSDKVersion in the root build.gradle rather than pinning it here.
