allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Redirect all Gradle build output to <project root>/build so that the Flutter
// tool finds the artifacts where it expects them.
def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    project.layout.buildDirectory.value(newBuildDir.dir(project.name))
}
// Flutter plugins pin their own Java/Kotlin levels (1.8, 11, ...). AGP aborts the
// build when a module's Java and Kotlin targets disagree ("Inconsistent JVM-target
// compatibility"), so pin every subproject to Java 17 on both sides.
// Must be registered before the `evaluationDependsOn` block below, which eagerly
// evaluates `:app`.
subprojects {
    afterEvaluate { proj ->
        if (proj.extensions.findByName("android") != null) {
            proj.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        proj.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            compilerOptions {
                jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
