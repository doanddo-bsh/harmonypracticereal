org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter's Gradle plugin applies the Kotlin Gradle Plugin itself; keep AGP's
# built-in Kotlin support off. Flutter's migrator re-adds this on every build.
android.builtInKotlin=false
# Flutter's Gradle plugin is not yet compatible with AGP's new DSL.
android.newDsl=false
