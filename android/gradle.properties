org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# R8 full mode is the AGP 8 default. Stated explicitly so the AGP 7 -> 8 behavior
# change is visible; flip to false if a minified release regresses. A release build
# with this on was smoke-tested on a physical Android 16 device (app launch, banner
# ad, and the answer bottom sheet all verified working); note that the app-level
# proguard rules were narrowed after that run, so the trimmed rule set has been
# verified statically but not yet on a device.
android.enableR8.fullMode=true

# The two flags below are AGP 9 options. AGP 8.11.1 (what this project builds with)
# does not define them at all -- its BooleanOption table contains no
# android.builtInKotlin and no android.newDsl, only android.experimental.newDslInterfaces
# -- and AGP silently ignores unrecognized android.* properties, so today they do
# nothing. They are kept only because Flutter's migrator unconditionally re-appends
# them on every `flutter build`; deleting them just makes the file churn. They become
# live on the move to AGP 9, at which point their effect needs testing.
android.builtInKotlin=false
android.newDsl=false
