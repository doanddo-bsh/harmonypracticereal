org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# R8 full mode is the AGP 8 default (BooleanOption.FULL_R8 defaults to true in
# 8.11.1). Stated explicitly so the AGP 7 -> 8 behavior change is visible; flip to
# false if a minified release regresses. The narrowed app/proguard-rules.pro was
# smoke-tested with this on: a release build ran on a physical Android 16 (API 36)
# device -- launch, all four tabs, staff notation, the answer bottom sheet and the
# AdMob banner ("Ad loaded") all worked, and both the gms measurement and ads
# dynamite modules loaded.
android.enableR8.fullMode=true

# Neither flag does anything on AGP 8.11.1 (what this project builds with): its
# BooleanOption table contains no android.builtInKotlin and no android.newDsl, only
# android.experimental.newDslInterfaces, and AGP never reads android.* properties it
# does not declare. They are kept only because Flutter's migrators
# (disable_built_in_kotlin_migration.dart / disable_new_dsl_migration.dart) re-append
# them whenever they are missing, so deleting them just makes the file churn.
# android.builtInKotlin already exists in AGP 8.13 (experimental, default false, with
# a future stage of softly-enforced true), so this line starts taking effect on an
# 8.13 bump -- not only on AGP 9. android.newDsl is still absent in 8.13.1 and lands
# later. Re-test both when bumping AGP.
android.builtInKotlin=false
android.newDsl=false
